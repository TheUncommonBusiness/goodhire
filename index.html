<style>
:root{
  --bg:#F3F2EF; --card:#FFFFFF; --ink:#191919; --ink2:#5E5E5E; --ink3:#8C8C8C; --line:#E6E3DD;
  --brand:#0789BA; --brand-soft:#E2F4FB; --open:#6E9F1E; --open-soft:#EEF5E0;
  --hire:#DC5928; --pill:#EDEBE7; --cel:#C2702A; --shadow:0 0 0 1px rgba(0,0,0,.06);
  --tab:rgba(255,255,255,.92); --sheet:#FFFFFF; --scrim:rgba(0,0,0,.38);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1B1F23; --ink:#EDEDED; --ink2:#B3B3B3; --ink3:#8A8A8A; --line:#2A2E33;
    --brand:#3CC2F0; --brand-soft:#0E2A35; --open:#A6C539; --open-soft:#1E2A10;
    --hire:#EE6A36; --pill:#2A2E33; --cel:#E3A25C; --shadow:0 0 0 1px rgba(255,255,255,.06);
    --tab:rgba(27,31,35,.92); --sheet:#1B1F23; --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1B1F23; --ink:#EDEDED; --ink2:#B3B3B3; --ink3:#8A8A8A; --line:#2A2E33;
  --brand:#3CC2F0; --brand-soft:#0E2A35; --open:#A6C539; --open-soft:#1E2A10;
  --hire:#EE6A36; --pill:#2A2E33; --cel:#E3A25C; --shadow:0 0 0 1px rgba(255,255,255,.06);
  --tab:rgba(27,31,35,.92); --sheet:#1B1F23; --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.status{display:none;height:54px;padding:18px 30px 0 34px;justify-content:space-between;align-items:center;font:600 16px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--card);flex:none}
.framed .status{display:flex}
.status .r{display:flex;gap:6px;align-items:center}.status svg{height:12px}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:3}
.logo{width:32px;height:32px;border-radius:8px;background:#DC5928;display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:6px;background:var(--pill);color:var(--ink2);font-size:14.5px;min-width:0}
.search svg{width:16px;height:16px;flex:none;opacity:.75}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink2)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--ink2)}
.iconbtn svg{width:22px;height:22px}
.stage{position:relative;flex:1;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);padding-bottom:96px;will-change:transform}
.screen.enter{animation:pushIn .42s cubic-bezier(.2,.8,.2,1) both}
.screen.leave{animation:pushOut .42s cubic-bezier(.2,.8,.2,1) both}
.screen.enterBack{animation:popIn .38s cubic-bezier(.2,.8,.2,1) both}
.screen.leaveBack{animation:popOut .38s cubic-bezier(.2,.8,.2,1) both}
.screen.fade{animation:fadeIn .28s ease both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none;filter:none}to{transform:translateX(-28%);filter:brightness(.92)}}
@keyframes popIn{from{transform:translateX(-28%);filter:brightness(.92)}to{transform:none;filter:none}}
@keyframes popOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);box-shadow:var(--shadow);margin-bottom:8px}
.sec{padding:16px}.sec h2{font-size:19px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
.muted{color:var(--ink2)}.small{font-size:13px}
.rise{animation:fadeIn .45s cubic-bezier(.2,.8,.2,1) both}
.post .hd{display:flex;gap:10px;padding:12px 16px 8px;cursor:pointer}
.post .who{min-width:0}
.post .who b{display:block;font-size:14.5px}
.post .who span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.3}
.post .tx{padding:0 16px 10px;font-size:14.5px}
.anniv{margin:0 16px 12px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#0789BA,#DC5928 62%,#FDBF3B);color:#fff;position:relative}
.anniv .in{padding:18px 16px 16px;display:flex;gap:14px;align-items:center;position:relative}
.anniv img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.9);flex:none}
.anniv b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.anniv strong{display:block;font-size:22px;line-height:1.15;margin-top:2px}
.anniv .yrs{position:absolute;right:-6px;top:-18px;font-size:120px;font-weight:800;opacity:.14;line-height:1}
.photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--pill)}
.counts{display:flex;justify-content:space-between;padding:8px 16px;font-size:12.5px;color:var(--ink2);min-height:32px}
.acts{display:flex;border-top:1px solid var(--line);padding:2px 8px}
.acts button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--ink2);font-size:12px;font-weight:600;border-radius:6px;position:relative}
.acts button svg{width:22px;height:22px}
.acts button.on{color:var(--cel)}
.burst{position:absolute;left:50%;top:4px;pointer-events:none;font-size:20px;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,0) scale(.4);opacity:0}25%{opacity:1;transform:translate(-50%,-18px) scale(1.25)}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
.ring{position:relative;flex:none}
.ring svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);overflow:visible}
.ring img{display:block;border-radius:50%;object-fit:cover;width:100%;height:100%;background:var(--pill)}
.ring .arc{fill:none;stroke:var(--open);stroke-linecap:round;stroke-dashoffset:0}
.ring.draw .arc{stroke-dashoffset:var(--len);animation:draw 1.1s .25s cubic-bezier(.3,.7,.2,1) forwards}
.ring text{fill:#fff;font:800 8.6px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.9px}
.ring.sm text{display:none}
.ring.draw text{opacity:0;animation:fadeTx .4s 1.05s forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fadeTx{to{opacity:1}}
.gridhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 4px}
.gridhead h2{margin:0;font-size:17px;font-weight:600}
.chipsrow{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 4px;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.fchip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 12px}
.pcard{background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;text-align:center;display:flex;flex-direction:column}
.pcard .cv{height:56px;background:linear-gradient(135deg,#0789BA,#DC5928)}
.pcard .ring{width:84px;height:84px;margin:-42px auto 0}
.pcard .ring img{border:3px solid var(--card)}
.pcard b{display:block;margin:8px 8px 2px;font-size:15px}
.pcard p{margin:0 10px;font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pcard .dd{font-size:12px;color:var(--ink2);margin:8px 0 10px}
.pcard .dd strong{color:var(--hire)}
.pcard .go{margin:0 10px 12px;border:1.5px solid var(--brand);color:var(--brand);border-radius:99px;padding:6px 0;font-weight:600;font-size:14px}
.more{display:block;margin:4px auto 16px;padding:10px 22px;border-radius:99px;border:1.5px solid var(--brand);color:var(--brand);font-weight:600}
.cover{height:118px;background:linear-gradient(120deg,#0789BA 0%,#DC5928 58%,#FDBF3B 100%);position:relative;overflow:hidden}
.cover svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.ph{padding:0 16px 16px;position:relative}
.ph .ring{width:118px;height:118px;margin-top:-62px}
.ph .ring img{border:4px solid var(--card)}
.ph h1{font-size:24px;font-weight:600;margin:12px 0 2px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph h1 .pron{font-size:13px;font-weight:400;color:var(--ink2)}
.ph .hl{font-size:15px;margin:0 0 6px}
.ph .loc{font-size:13px;color:var(--ink2)}
.aihs{display:inline-block;margin-top:8px;font-size:12px;color:var(--ink2);background:var(--pill);padding:3px 8px;border-radius:99px}
.ph .org{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;font-weight:600}
.ph .org i,.ex .cert{width:22px;height:22px;border-radius:4px;background:var(--hire);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;font-weight:800}
.ph .days{margin-top:8px;font-size:13px;color:var(--ink2)}
.ph .days b{color:var(--hire)}
.btns{display:flex;gap:8px;margin-top:14px}
.pillbtn{height:36px;border-radius:99px;padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s}
.pillbtn:active{transform:scale(.96)}
.pillbtn.primary{background:var(--hire);color:#fff;flex:1}
.pillbtn.outline{border:1.5px solid var(--brand);color:var(--brand);flex:1}
.pillbtn.circle{width:36px;padding:0;border:1.5px solid var(--ink3);color:var(--ink2)}
.opento{margin-top:14px;background:var(--open-soft);border-radius:8px;padding:12px;font-size:14px}
.opento b{display:block}
.opento button{color:var(--brand);font-weight:600;font-size:14px;margin-top:4px}
.about{font-size:14.5px;line-height:1.5}
.about.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.seemore{color:var(--ink2);font-weight:600;font-size:14px;margin-top:4px}
.ex{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:0}
.ex .lg{width:48px;height:48px;border-radius:6px;background:var(--pill);display:grid;place-items:center;font-size:22px;flex:none}
.ex .lg.cert{width:48px;height:48px;font-size:15px;border-radius:6px}
.ex b{display:block;font-size:15px;font-weight:600}
.ex span{display:block;font-size:13.5px}
.ex .d{color:var(--ink2);font-size:13px}
.ex p{margin:6px 0 0;font-size:14px}
.sk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:10px}
.sk:first-of-type{border-top:0;padding-top:2px}
.sk b{font-size:15px;font-weight:600}
.sk .by{font-size:12.5px;color:var(--ink2);margin-top:2px}
.endo{border:1.5px solid var(--ink3);color:var(--ink2);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13.5px;flex:none;transition:all .2s}
.endo.on{border-color:var(--open);color:var(--open);background:var(--open-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:500}
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);display:grid;place-items:center;animation:pulse 2.2s infinite}
.play svg{width:26px;height:26px;margin-left:4px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.vtag{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:6px}
.feat{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px}
.feat .fi{flex:0 0 78%;scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.feat .fi .cap{padding:10px 12px;font-size:13.5px}
.feat .fi .cap b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .fi .cap span{color:var(--ink2);font-size:12.5px}
.rec{padding:20px 16px 8px}
.rec .hi{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.rec h1{font-size:28px;line-height:1.12;margin:6px 0 6px;letter-spacing:-.02em}
.rec p{margin:0;color:var(--ink2)}
.rcard{margin:14px 12px 8px;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08),var(--shadow)}
.rcard .photo{aspect-ratio:4/3}
.rcard .bd{padding:16px}
.bigd{display:flex;align-items:baseline;gap:8px}
.bigd b{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--hire);line-height:1;font-variant-numeric:tabular-nums}
.bigd span{color:var(--ink2);font-weight:500}
.rcard h2{font-size:22px;margin:10px 0 2px}
.prog{height:6px;background:var(--pill);border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hire),#FDBF3B);border-radius:99px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.progl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px}
.namebox{margin:18px 16px;background:var(--card);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.namebox h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.namebox input{width:100%;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;margin:14px 0 12px;outline:none}
.namebox input:focus{border-color:var(--brand)}
.namebox .pillbtn{width:100%;height:46px;font-size:16px}
.nt{display:flex;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);width:100%;text-align:left}
.nt.new{background:var(--brand-soft)}
.nt img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--pill)}
.nt p{margin:0;font-size:14.5px}
.nt span{display:block;font-size:12.5px;color:var(--ink2);margin-top:4px}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;background:var(--tab);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.framed .tabs{padding-bottom:26px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:600;position:relative;padding:2px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;top:-7px;width:36px;height:2px;background:var(--ink);border-radius:2px}
.badge{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--hire);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:8;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--sheet);border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1)}
.framed .sheet{padding-bottom:34px}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.sheet .row:first-of-type{border-top:0}
.sheet .row i{font-style:normal;width:26px;text-align:center;flex:none}
.sheet .fine{font-size:12.5px;color:var(--ink2);margin:10px 0 14px}
.sheet .pillbtn{width:100%;height:44px;font-size:16px}
.sheet .pillbtn+.pillbtn{margin-top:8px}
.conf{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:hidden}
.conf span{position:absolute;top:-30px;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
.toast{position:absolute;left:50%;bottom:92px;z-index:11;transform:translate(-50%,16px);opacity:0;background:#1F2326;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;white-space:nowrap;transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.finger{position:absolute;z-index:20;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1),opacity .25s,transform .15s}
.finger.on{opacity:1}.finger.tap{transform:scale(.72)}
.note{font-size:11.5px;color:var(--ink3);text-align:center;padding:14px 20px 0;line-height:1.45}
.loading{display:grid;place-items:center;height:100%;color:var(--ink2);font-size:14px}
</style>
</head>

    <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".45"/></svg></span></div>
  <header class="bar" id="bar"></header>
  <div class="stage" id="stage"><div class="loading">Loading 491 candidates…</div></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="conf" id="conf"></div>
  <div class="toast" id="toast"></div>
  <div class="finger" id="finger"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const DEMO = Q.get("demo");
if (Q.get("frame") || DEMO) document.getElementById("app").classList.add("framed");
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const his = d => d.sex === "Male" ? "his" : "her";
const him = d => d.sex === "Male" ? "him" : "her";
const store = { get(k, d){ try { const v = localStorage.getItem("gh:"+k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ if (DEMO) return; try { localStorage.setItem("gh:"+k, JSON.stringify(v)); } catch(e){} } };
let DOGS = [], BYID = {}, STATS = {};
const state = { tab:"home", stack:[], celebrated:store.get("cel",{}), endorsed:store.get("endo",{}), filter:"all", q:"", shown:24 };

const I = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 9v2h-2v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9H1V9l11-7z"/></svg>',
  net:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 16v6H3v-6a3 3 0 0 1 3-3h3a3 3 0 0 1 3 3zm5.5-3A3.5 3.5 0 1 0 14 9.5a3.5 3.5 0 0 0 3.5 3.5zm1 2h-2a2.5 2.5 0 0 0-2.5 2.5V22h7v-4.5a2.5 2.5 0 0 0-2.5-2.5zM7.5 2A4.5 4.5 0 1 0 12 6.5 4.49 4.49 0 0 0 7.5 2z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 14.9 8.6l6.6.8-4.9 4.5 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 19h-8.28a2 2 0 1 1-3.44 0H2v-1a4.52 4.52 0 0 1 1.17-2.83l1-1.17h15.7l1 1.17A4.42 4.42 0 0 1 22 18zM18.21 7.44A6.27 6.27 0 0 0 12 2a6.27 6.27 0 0 0-6.21 5.44L5 13h14z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8l-5-5-5 5M12 3v13M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  cel:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 21 9.5 7l7.5 7.5zM14 3l1 2.5L17.5 6 15 7l-1 2.5L13 7l-2.5-1L13 5zm6 6 .7 1.6 1.6.7-1.6.7L20 13.6l-.7-1.6-1.6-.7 1.6-.7z"/></svg>',
  ref:'<svg viewBox="0 0 24 24"><path d="M21 3 9.5 14.5M21 3l-7 18-4.5-6.5L3 10z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>',
};
const PAW='<path d="M12.2 11.2c-3.4 0-6.4 3.6-6.4 6.3 0 1.9 1.6 2.6 3.2 2.6 1.3 0 2-.6 3.2-.6s1.9.6 3.2.6c1.6 0 3.2-.7 3.2-2.6 0-2.7-3-6.3-6.4-6.3z"/><ellipse cx="6" cy="9" rx="2.1" ry="2.6"/><ellipse cx="10" cy="5.6" rx="2.1" ry="2.6"/><ellipse cx="14.4" cy="5.6" rx="2.1" ry="2.6"/><ellipse cx="18.4" cy="9" rx="2.1" ry="2.6"/>';
const LOGO = '<svg viewBox="0 0 120 120"><path d="M44 18h32a9 9 0 0 1 9 9v11H75v-9H45v9H35V27a9 9 0 0 1 9-9z" fill="#fff"/><rect x="8" y="34" width="104" height="78" rx="20" fill="#fff"/><g transform="translate(31 42) scale(2.5)" fill="#DC5928">'+PAW+'</g></svg>';
const PAWS = '<svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice"><g fill="#fff">'+Array.from({length:14},(_,i)=>{const x=(i*61)%420-10,y=(i*37)%130-10,r=(i*29)%360;return `<g transform="translate(${x} ${y}) rotate(${r}) scale(.9)">${PAW}</g>`}).join("")+'</g></svg>';
const PLAY = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 4l14 8-14 8z"/></svg>';
const avatar = d => d.headshot || d.photos[0] || "";

function ring(d, size, extra=""){
  const r = 50, c = 2*Math.PI*r, arc = c*0.62, id = "a"+d.id.replace(/\W/g,"")+size;
  return `<div class="ring ${extra} ${size<70?"sm":""}" style="width:${size}px;height:${size}px;--len:${arc}">
    <img src="${esc(avatar(d))}" alt="${esc(d.name)}" loading="lazy">
    <svg viewBox="-6 -6 112 112"><defs><path id="${id}" d="M 8 50 A 42 42 0 0 0 92 50"/></defs>
      <circle class="arc" cx="50" cy="50" r="${r}" stroke-width="9" transform="rotate(20 50 50)" style="stroke-dasharray:${arc} ${c}"/>
      <text><textPath href="#${id}" startOffset="50%" text-anchor="middle">#OPENTOADOPT</textPath></text></svg></div>`;
}
function videoHTML(v){ return `<div class="vid" data-play="${esc(v.id)}"><img src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="${esc(v.title)}" loading="lazy"><span class="play">${PLAY}</span><span class="vtag">▶ Video from Austin Pets Alive!</span></div>`; }
function playVideo(box){
  const id = box.dataset.play; if (!id || box.querySelector("iframe")) return;
  const f = document.createElement("iframe");
  f.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1&rel=0&modestbranding=1${DEMO?"&mute=1":""}`;
  f.allow = "autoplay; encrypted-media; picture-in-picture"; f.allowFullscreen = true; f.title = "Video from Austin Pets Alive!";
  box.innerHTML = ""; box.appendChild(f);
}

/* ---------- top bar ---------- */
function setBar(mode, d){
  const bar = $("#bar");
  if (mode === "back") bar.innerHTML = `<button class="iconbtn" data-act="back" aria-label="Back">${I.back}</button><div class="search">${I.search}<span>${esc(d.name)}</span></div><button class="iconbtn" data-share="${d.id}" aria-label="Share">${I.share}</button>`;
  else bar.innerHTML = `<div class="logo" aria-hidden="true">${LOGO}</div><label class="search">${I.search}<input id="q" type="search" placeholder="Search dogs, skills, breeds" value="${esc(state.q)}" autocomplete="off"></label><button class="iconbtn" data-act="recruit" aria-label="Your recruit">${I.star}</button>`;
  const q = $("#q"); if (q) q.oninput = () => { state.q = q.value.trim().toLowerCase(); state.shown = 24; if (state.tab !== "net") goTab("net", true); else redrawGrid(); };
}

/* ---------- feed ---------- */
function buildPosts(){
  const posts = [], seen = new Set();
  const top = DOGS.slice(0, 120);
  let i = 0;
  for (const d of top) {
    if (seen.has(d.id)) continue;
    const kind = (d.videos.length && i % 3 === 1) ? "video" : (d.years >= 1 && i % 3 === 0) ? "anniv" : "photo";
    seen.add(d.id); i++;
    const ago = i < 4 ? `${i*2}h` : i < 12 ? `${Math.ceil(i/3)}d` : `${Math.ceil(i/6)}w`;
    let text;
    if (kind === "anniv") text = `${d.years} year${d.years>1?"s":""} at Austin Pets Alive! today. Still open to my next role: family member. #OpenToAdopt`;
    else if (kind === "video") text = `New video on my profile. Recruiters, this is my portfolio. #OpenToAdopt`;
    else text = `I'm #OpenToAdopt. ${d.headline}. Ready for a long-term role as your family member.`;
    posts.push({ id:"p"+d.id, d, kind, ago, text });
  }
  return posts;
}
let POSTS = [];
function postHTML(p){
  const d = p.d, on = !!state.celebrated[p.id];
  let body = `<div class="tx">${esc(p.text)}</div>`;
  if (p.kind === "anniv") body += `<div class="anniv"><div class="yrs">${d.years}</div><div class="in"><img src="${esc(avatar(d))}" alt="" loading="lazy"><div><b>Work anniversary</b><strong>${d.years} year${d.years>1?"s":""} at Austin Pets Alive!</strong><span class="small" style="opacity:.9">Still open to a forever home</span></div></div></div>`;
  else if (p.kind === "video") body += videoHTML(d.videos[0]);
  else body += `<img class="photo" src="${esc(d.photos[0]||avatar(d))}" alt="${esc(d.name)}" loading="lazy">`;
  return `<article class="card post" data-post="${p.id}">
    <div class="hd" data-open="${d.id}">${ring(d,48)}<div class="who"><b>${esc(d.name)}</b><span>${esc(d.headline)}</span><span>${esc(p.ago)} · ${fmt(d.days)} days on the market</span></div></div>
    ${body}
    <div class="counts"><span>${on?"🎉 You celebrated":"Be the first to celebrate"}</span><span></span></div>
    <div class="acts"><button class="${on?"on":""}" data-cel="${p.id}">${I.cel}<span>Celebrate</span></button><button data-refer="${d.id}">${I.ref}<span>Refer</span></button><button data-open="${d.id}">${I.share}<span>View profile</span></button></div></article>`;
}
function homeView(){
  return `<div class="card sec" style="display:flex;gap:12px;align-items:center"><div class="logo" style="width:44px;height:44px;border-radius:50%">${LOGO}</div>
    <div><b style="font-size:15px">${fmt(STATS.total)} dogs are open to work</b><div class="muted small">${fmt(STATS.overYear)} have waited more than a year. Help one land the role of a lifetime.</div></div></div>
    <div id="feed">${POSTS.slice(0, 12).map(postHTML).join("")}</div>
    ${POSTS.length>12?`<button class="more" data-morefeed>Show more posts</button>`:""}
    <p class="note">${FOOT}</p>`;
}
const FOOT = "GoodHire is a UCL Live Austin project, not an official Austin Pets Alive! site. Dog facts, photos and videos come from APA's public adoption listings; profile copy is written by AI from those facts. Hire and adoption questions go to Austin Pets Alive!.";

/* ---------- network ---------- */
const FILTERS = [["all","All"],["kids","Good with kids"],["cats","Good with cats"],["dogs","Good with dogs"],["house","Housetrained"],["senior","Senior"],["urgent","Urgent foster"],["video","Has video"]];
function filtered(){
  const q = state.q;
  return DOGS.filter(d => {
    const f = state.filter;
    if (f === "kids" && !d.certs.includes("Good with kids")) return false;
    if (f === "cats" && !d.certs.includes("Good with cats")) return false;
    if (f === "dogs" && !d.certs.includes("Good with dogs")) return false;
    if (f === "house" && !d.certs.includes("Housetrained")) return false;
    if (f === "senior" && !(d.age >= 7)) return false;
    if (f === "urgent" && d.flagKind !== "urgent") return false;
    if (f === "video" && !d.videos.length) return false;
    if (q && !(d.name+" "+d.breed+" "+d.headline+" "+d.skills.join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
}
function cardHTML(d){ return `<button class="pcard" data-open="${d.id}"><div class="cv"></div>${ring(d,84)}<b>${esc(d.name)}</b><p>${esc(d.headline)}</p><div class="dd"><strong>${d.days!=null?fmt(d.days):"?"}</strong> days on the market</div><span class="go">View</span></button>`; }
function netView(){
  return `<div class="card"><div class="gridhead"><h2>Dogs open to work near Austin</h2><span class="muted small" id="cnt"></span></div>
    <div class="chipsrow">${FILTERS.map(([k,l])=>`<button class="fchip ${state.filter===k?"on":""}" data-filter="${k}">${l}</button>`).join("")}</div>
    <div class="muted small" style="padding:4px 16px 2px">Longest on the market first</div>
    <div class="grid" id="grid"></div><div id="gridmore"></div></div><p class="note">${FOOT}</p>`;
}
function redrawGrid(){
  const list = filtered(), g = $("#grid"); if (!g) return;
  g.innerHTML = list.slice(0, state.shown).map(cardHTML).join("") || `<p class="muted" style="grid-column:1/-1;text-align:center;padding:24px 0">No dogs match that yet.</p>`;
  $("#cnt").textContent = fmt(list.length);
  $("#gridmore").innerHTML = list.length > state.shown ? `<button class="more" data-moregrid>Show more dogs</button>` : "";
}

/* ---------- recruit ---------- */
function deviceId(){ let id = store.get("device"); if (!id){ id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now()); store.set("device", id); } return id; }
function hash(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function recruitDog(){
  if (DEMO) return DOGS[0];
  let id = store.get("recruit");
  if (id && BYID[id]) return BYID[id];
  const pool = DOGS.slice(0, Math.min(300, DOGS.length));
  const d = pool[hash(deviceId()) % pool.length]; store.set("recruit", d.id); return d;
}
function recruitView(){
  const name = DEMO ? (Q.get("name") || "Carter") : store.get("name");
  if (!name) return `<div class="namebox rise"><div class="rec" style="padding:0"><div class="hi">Your recruit</div></div><h1>Every dog here needs a recruiter.</h1>
    <div class="muted">Tell us your first name and we'll match you with one of the longest-waiting dogs at Austin Pets Alive!.</div>
    <input id="nm" maxlength="40" placeholder="First name" autocomplete="given-name" enterkeyhint="go"><button class="pillbtn primary" data-setname>Meet my recruit</button>
    <div class="muted small" style="margin-top:10px">Your name stays on this phone. Nothing is sent anywhere.</div></div>`;
  const d = recruitDog();
  return `<div class="rec rise"><div class="hi">Your recruit</div><h1>Hi, ${esc(name)}.<br>Meet ${esc(d.name)}.</h1>
    <p>For the next 48 hours you're ${his(d)} recruiter. Help ${him(d)} land the role of a lifetime: family member.</p></div>
    <div class="rcard rise" style="animation-delay:.12s"><img class="photo" src="${esc(d.photos[0]||avatar(d))}" alt="${esc(d.name)}">
      <div class="bd"><div class="bigd"><b data-count="${d.days}">0</b><span>days waiting</span></div>
      <h2>${esc(d.name)}</h2><div class="muted">${esc(d.headline)}</div>
      <div class="prog"><i data-prog="${Math.min(100, d.days/STATS.maxDays*100).toFixed(1)}"></i></div>
      <div class="progl"><span>Arrived ${esc(d.intake)}</span><span>Today</span></div>
      <div class="btns"><button class="pillbtn outline" data-open="${d.id}">View profile</button><button class="pillbtn primary" data-refer="${d.id}">Refer ${esc(d.name)}</button></div></div></div>`;
}

/* ---------- alerts ---------- */
function alertsView(){
  const r = DEMO ? DOGS[0] : (store.get("recruit") && BYID[store.get("recruit")]);
  const urgent = DOGS.filter(d=>d.flagKind==="urgent"), sitter = DOGS.filter(d=>d.flagKind==="sitter");
  const anniv = DOGS.filter(d=>d.years>=1).length;
  const items = [];
  if (r) items.push({d:r, t:`You're <b>${esc(r.name)}</b>'s recruiter. ${his(r)[0].toUpperCase()+his(r).slice(1)} profile has been on the market for ${fmt(r.days)} days.`, s:"Now", n:1});
  else items.push({d:DOGS[0], t:`<b>Get your recruit.</b> Every dog here needs someone in their corner.`, s:"Now", n:1, tab:"rec"});
  items.push({d:DOGS[1], t:`<b>${fmt(anniv)} dogs</b> in your network have spent more than a year at Austin Pets Alive!`, s:"Today", n:1});
  if (urgent.length) items.push({d:urgent[0], t:`<b>${fmt(urgent.length)} dogs</b> are urgent foster needs, starting with <b>${esc(urgent[0].name)}</b>.`, s:"Today"});
  sitter.slice(0,3).forEach(d=>items.push({d, t:`<b>${esc(d.name)}</b> is hiring a foster sitter.`, s:"This week"}));
  return items.map((x,i)=>`<button class="nt ${x.n?"new":""} rise" style="animation-delay:${i*50}ms" ${x.tab?`data-tab="${x.tab}"`:`data-open="${x.d.id}"`}><img src="${esc(avatar(x.d))}" alt=""><div><p>${x.t}</p><span>${x.s}</span></div></button>`).join("");
}

/* ---------- profile ---------- */
function profileView(id){
  const d = BYID[id]; if (!d) return `<p class="note">That dog has found a home or isn't listed anymore.</p>`;
  const feat = d.photos.slice(0,2).map((p,i)=>`<div class="fi"><img class="photo" src="${esc(p)}" alt="" style="aspect-ratio:16/9" loading="lazy"><div class="cap"><b>Real photo of ${esc(d.name)}</b><span>Photo · Austin Pets Alive!</span></div></div>`).join("")
    + d.videos.map(v=>`<div class="fi">${videoHTML(v)}<div class="cap"><b>${esc(v.title)}</b><span>Video · Austin Pets Alive!</span></div></div>`).join("");
  return `<div class="card"><div class="cover">${PAWS}</div>
    <div class="ph">${ring(d,118,"draw")}
      <h1>${esc(d.name)} <span class="pron">(${d.sex==="Male"?"He/Him":"She/Her"})</span></h1>
      <p class="hl">${esc(d.headline)}</p>
      <div class="loc">Austin, TX · ${esc(d.where)} · ${esc(d.breed)}</div>
      ${d.headshot?`<div class="aihs">📸 AI headshot · real photos and videos from APA below</div>`:""}
      <div class="org"><i>A!</i>Austin Pets Alive!</div>
      <div class="days"><b data-count="${d.days}">0</b> days on the market${d.age!=null?` · ${d.age} years old`:""} · ${esc(d.size)}</div>
      <div class="btns"><button class="pillbtn primary" data-hire="${d.id}">Hire</button><button class="pillbtn outline" data-refer="${d.id}">Refer</button><button class="pillbtn circle" data-share="${d.id}" aria-label="Share">${I.more}</button></div>
      <div class="opento"><b>Open to adoption</b>Forever home · Family member<br><button data-details="${d.id}">Show details</button></div>
    </div></div>
    ${d.flag?`<div class="card sec"><b>Now hiring help</b><div class="muted" style="margin-top:4px">${esc(d.flag)}</div></div>`:""}
    <div class="card sec"><h2>About</h2><div class="about clamp" id="about">${esc(d.about)}</div><button class="seemore" data-more>…see more</button></div>
    ${feat?`<div class="card sec"><h2>Featured</h2><div class="feat">${feat}</div></div>`:""}
    <div class="card sec"><h2>Experience</h2>${d.experience.map(x=>`<div class="ex"><div class="lg">${esc(x.icon)}</div><div><b>${esc(x.role)}</b><span>${esc(x.org)}</span><span class="d">${esc(x.when)}</span>${x.note?`<p>${esc(x.note)}</p>`:""}</div></div>`).join("")}</div>
    ${d.education.length?`<div class="card sec"><h2>Education</h2>${d.education.map(x=>`<div class="ex"><div class="lg">🎓</div><div><b>${esc(x.school)}</b><span>${esc(x.what)}</span><span class="d">${esc(x.when)}</span></div></div>`).join("")}</div>`:""}
    ${d.certs.length?`<div class="card sec"><h2>Licenses & certifications</h2>${d.certs.map(c=>`<div class="ex"><div class="lg cert" style="background:var(--hire);color:#fff;font-weight:800">A!</div><div><b>${esc(c)}</b><span>Austin Pets Alive!</span><span class="d">Verified on ${his(d)} adoption listing</span></div></div>`).join("")}</div>`:""}
    <div class="card sec"><h2>Skills</h2>${d.skills.map((s,i)=>{const k=d.id+"|"+i,on=!!state.endorsed[k];return `<div class="sk"><div><b>${esc(s)}</b><div class="by">From ${his(d)} APA write-up${on?" · Endorsed by you":""}</div></div><button class="endo ${on?"on":""}" data-endo="${k}">${on?"✓ Endorsed":"Endorse"}</button></div>`}).join("")}</div>
    ${d.interests.length?`<div class="card sec"><h2>Interests</h2><div class="chips">${d.interests.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>`:""}
    <div class="card sec"><h2>Ideal role</h2><div class="about">${esc(d.idealRole)}</div></div>
    <p class="note">Facts from Austin Pets Alive!'s public listing for ${esc(d.name)}. The Hire button goes to ${his(d)} adoption page at APA.<br>${FOOT}</p>`;
}

/* ---------- navigation ---------- */
const stage = $("#stage"); let current = null;
function mount(html, anim){
  const el = document.createElement("div"); el.className = "screen"; el.innerHTML = html; stage.appendChild(el);
  if (current) {
    const old = current;
    if (anim === "push") { old.classList.add("leave"); el.classList.add("enter"); }
    else if (anim === "pop") { old.classList.add("leaveBack"); el.classList.add("enterBack"); el.style.zIndex = 0; old.style.zIndex = 1; }
    else el.classList.add("fade");
    setTimeout(() => old.remove(), anim ? 440 : 300);
  } else { stage.innerHTML = ""; stage.appendChild(el); el.classList.add("fade"); }
  current = el; return el;
}
function tabHTML(t){ return t==="home"?homeView():t==="net"?netView():t==="rec"?recruitView():alertsView(); }
function goTab(t, keepBar){
  state.tab = t; state.stack = []; if (!keepBar) setBar("main"); renderTabs();
  const el = mount(tabHTML(t)); if (t === "net") redrawGrid(); if (t === "rec") animateRecruit(el);
  if (!DEMO) history.replaceState(null, "", t === "home" ? location.pathname + location.search : "#/" + ({net:"network",rec:"recruit",alerts:"alerts"}[t]));
}
function openProfile(id, fromHash){
  if (!BYID[id]) return;
  state.stack.push(id); setBar("back", BYID[id]);
  const el = mount(profileView(id), "push"); countUp(el);
  if (!DEMO && !fromHash) history.pushState({dog:id}, "", "#/dog/" + id);
}
function back(){
  state.stack.pop();
  if (state.stack.length) { const id = state.stack[state.stack.length-1]; setBar("back", BYID[id]); mount(profileView(id), "pop"); }
  else { setBar("main"); const el = mount(tabHTML(state.tab), "pop"); if (state.tab==="net") redrawGrid(); if (state.tab==="rec") animateRecruit(el); }
}
function renderTabs(){
  const T = [["home","Home",I.home],["net","Network",I.net],["rec","Recruit",I.star],["alerts","Alerts",I.bell]];
  $("#tabs").innerHTML = T.map(([k,l,ic])=>`<button class="${state.tab===k?"on":""}" data-tab="${k}">${ic}<span>${l}</span>${k==="alerts"?`<span class="badge">${3+Math.min(3,DOGS.filter(d=>d.flagKind==="sitter").length)}</span>`:""}</button>`).join("");
}
addEventListener("popstate", () => { if (state.stack.length) back(); else route(); });
function route(){
  const h = location.hash;
  const m = h.match(/^#\/dog\/(.+)$/);
  if (m && BYID[decodeURIComponent(m[1])]) { goTab("home"); openProfile(decodeURIComponent(m[1]), true); return; }
  goTab(h === "#/network" ? "net" : h === "#/recruit" ? "rec" : h === "#/alerts" ? "alerts" : "home");
}

/* ---------- interactions ---------- */
document.getElementById("app").addEventListener("click", ev => {
  const pv = ev.target.closest("[data-play]"); if (pv) return playVideo(pv);
  const t = ev.target.closest("button,[data-open]"); if (!t) return;
  if (t.dataset.tab && t.closest("#tabs,.nt")) return goTab(t.dataset.tab);
  if (t.dataset.act === "back") return history.length > 1 && !DEMO ? history.back() : back();
  if (t.dataset.act === "recruit") return goTab("rec");
  if (t.dataset.cel) return celebrate(t);
  if (t.dataset.refer) return refer(t.dataset.refer);
  if (t.dataset.share) return refer(t.dataset.share);
  if (t.dataset.hire) return hire(t.dataset.hire);
  if (t.dataset.details) return details(t.dataset.details);
  if (t.dataset.endo) return endorse(t);
  if (t.dataset.filter) { state.filter = t.dataset.filter; state.shown = 24; document.querySelectorAll(".fchip").forEach(c=>c.classList.toggle("on", c.dataset.filter===state.filter)); return redrawGrid(); }
  if (t.hasAttribute("data-moregrid")) { state.shown += 24; return redrawGrid(); }
  if (t.hasAttribute("data-morefeed")) { const f = $("#feed"), n = f.children.length; f.insertAdjacentHTML("beforeend", POSTS.slice(n, n+12).map(postHTML).join("")); if (n+12 >= POSTS.length) t.remove(); return; }
  if (t.hasAttribute("data-setname")) return setName();
  if (t.hasAttribute("data-more")) { const a = current.querySelector("#about"); a.classList.toggle("clamp"); t.textContent = a.classList.contains("clamp")?"…see more":"Show less"; return; }
  if (t.dataset.open) return openProfile(t.dataset.open);
});
document.getElementById("app").addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "nm") setName(); });
$("#scrim").addEventListener("click", closeSheet);
function setName(){ const v = ($("#nm")?.value || "").trim().slice(0,40); if (!v) { $("#nm")?.focus(); return; } store.set("name", v); const el = mount(recruitView()); animateRecruit(el); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1900); }
function celebrate(btn){
  const id = btn.dataset.cel; state.celebrated[id] = !state.celebrated[id]; store.set("cel", state.celebrated);
  btn.classList.toggle("on", !!state.celebrated[id]);
  if (state.celebrated[id]) { const b=document.createElement("span"); b.className="burst"; b.textContent="🎉"; btn.appendChild(b); setTimeout(()=>b.remove(),900); }
  btn.closest(".post").querySelector(".counts").innerHTML = `<span>${state.celebrated[id]?"🎉 You celebrated":"Be the first to celebrate"}</span><span></span>`;
}
function endorse(btn){
  const k = btn.dataset.endo, on = !state.endorsed[k]; state.endorsed[k] = on; store.set("endo", state.endorsed);
  btn.classList.toggle("on", on); btn.textContent = on ? "✓ Endorsed" : "Endorse";
  const d = BYID[k.split("|")[0]]; btn.parentElement.querySelector(".by").textContent = `From ${his(d)} APA write-up${on?" · Endorsed by you":""}`;
}
async function refer(id){
  const d = BYID[id]; if (!d) return;
  const url = location.origin + location.pathname + "#/dog/" + encodeURIComponent(id);
  const text = `${d.name} has been on the market for ${fmt(d.days)} days at Austin Pets Alive! ${d.headline}. Know anyone hiring for "family member"?`;
  if (DEMO) return toast(`Referral for ${d.name} sent`);
  try { if (navigator.share) { await navigator.share({title:`${d.name} is #OpenToAdopt`, text, url}); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(text + " " + url); toast("Link copied. Paste it anywhere."); } catch(e){ toast("Sharing isn't available here."); }
}
function openSheet(html){ $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); }
function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); }
function details(id){
  const d = BYID[id];
  openSheet(`<h3>Open to adoption</h3><div class="muted small" style="margin-bottom:8px">${esc(d.name)} · ${esc(d.headline)}</div>
    <div class="row"><i>🏡</i><div><b>Ideal role</b><br>${esc(d.idealRole)}</div></div>
    <div class="row"><i>📍</i><div><b>Location</b><br>Austin, TX · ${esc(d.where)}</div></div>
    <div class="row"><i>⏳</i><div><b>Time on the market</b><br>${fmt(d.days)} days, since ${esc(d.intake)}</div></div>
    <button class="pillbtn outline" style="margin-top:12px" data-close>Close</button>`);
  $("#sheet [data-close]").onclick = closeSheet;
}
function hire(id){
  const d = BYID[id];
  openSheet(`<h3>Hire ${esc(d.name)}</h3><div class="muted small" style="margin-bottom:8px">Position: Family member · Full-time · Forever</div>
    <div class="row"><i>🏡</i><div><b>${esc(d.name)} does best in</b><br>${esc(d.idealRole)}</div></div>
    ${d.certs.length?`<div class="row"><i>✅</i><div><b>Verified by APA</b><br>${d.certs.map(esc).join(" · ")}</div></div>`:""}
    <p class="fine">Applying takes you to ${esc(d.name)}'s adoption page at Austin Pets Alive!, where their team takes it from here.</p>
    <button class="pillbtn primary" data-go>Continue to Austin Pets Alive!</button><button class="pillbtn outline" data-close>Not now</button>`);
  $("#sheet [data-close]").onclick = closeSheet;
  $("#sheet [data-go]").onclick = () => { confetti(); if (!DEMO) setTimeout(()=>{ window.open(d.url, "_blank", "noopener"); closeSheet(); }, 750); else setTimeout(closeSheet, 1400); };
}
function confetti(){
  const c = $("#conf"), em = ["🐾","🎉","🦴","🧡","🐶"];
  for (let i=0;i<46;i++){ const s=document.createElement("span"); s.textContent=em[i%em.length]; s.style.left=Math.random()*100+"%"; s.style.fontSize=(16+Math.random()*16)+"px"; s.style.setProperty("--r",(Math.random()*720-360)+"deg"); s.style.animationDuration=(1.6+Math.random()*1.4)+"s"; s.style.animationDelay=(Math.random()*.35)+"s"; c.appendChild(s); setTimeout(()=>s.remove(),3400); }
}
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{ const to=+el.dataset.count||0, t0=performance.now(), dur=1400;
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,4); el.textContent=fmt(Math.round(to*e)); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
}
function animateRecruit(el){ countUp(el); setTimeout(()=>el.querySelectorAll("[data-prog]").forEach(i=>i.style.width=i.dataset.prog+"%"),250); }

/* ---------- stage demo tours (?demo=feed|profile|recruit) ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function tapEl(sel, opts={}){
  const el = typeof sel === "string" ? (current.querySelector(sel) || document.querySelector(sel)) : sel; if (!el) return;
  if (opts.scroll !== false) { el.scrollIntoView({block:"center", behavior:"smooth"}); await wait(650); }
  const r = el.getBoundingClientRect(), a = $("#app").getBoundingClientRect(), f = $("#finger");
  f.style.left = (r.left - a.left + r.width/2) + "px"; f.style.top = (r.top - a.top + r.height/2) + "px";
  f.classList.add("on"); await wait(600); f.classList.add("tap"); await wait(140); el.click(); f.classList.remove("tap"); await wait(300); f.classList.remove("on");
}
async function scrollBy(px, ms=1600){ const s=current, from=s.scrollTop, t0=performance.now(); await new Promise(res=>{ const st=t=>{ const p=Math.min(1,(t-t0)/ms), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; s.scrollTop=from+px*e; p<1?requestAnimationFrame(st):res(); }; requestAnimationFrame(st); }); }
const SCRIPTS = {
  feed: async () => { goTab("home"); await wait(1400); await tapEl('[data-cel]'); await wait(1100); await scrollBy(420,1800); await wait(500);
    const v = current.querySelector('[data-play]'); if (v) { await tapEl(v); await wait(5200); }
    await scrollBy(520,1800); await wait(600); const hd = current.querySelectorAll('.post .hd')[2]; if (hd) { await tapEl(hd,{scroll:false}); await wait(1600); await scrollBy(650,2200); await wait(800); await tapEl('#bar [data-act="back"]',{scroll:false}); await wait(1000); } },
  profile: async () => { goTab("net"); await wait(1500); await tapEl('.pcard'); await wait(1900); await scrollBy(360,1700); await wait(500); await tapEl('[data-more]'); await wait(1300); await tapEl('[data-endo]'); await wait(900); await scrollBy(-2000,1200); await wait(400); await tapEl('[data-hire]',{scroll:false}); await wait(1500); await tapEl('#sheet [data-go]',{scroll:false}); await wait(2600); await tapEl('#bar [data-act="back"]',{scroll:false}); await wait(900); },
  recruit: async () => { goTab("rec"); await wait(2600); await tapEl('[data-refer]'); await wait(1700); goTab("alerts"); await wait(1300); await tapEl('.nt'); await wait(1900); await scrollBy(900,2600); await wait(700); await tapEl('#bar [data-act="back"]',{scroll:false}); await wait(900); },
};
async function runDemo(n){ const s = SCRIPTS[n]; if (!s) return; for(;;){ try { await s(); } catch(e){} closeSheet(); state.endorsed = {}; state.celebrated = {}; await wait(400); } }

/* ---------- start ---------- */
fetch("data/dogs.json", {cache:"no-cache"}).then(r => r.json()).then(data => {
  DOGS = data.dogs; STATS = data.stats; DOGS.forEach(d => BYID[d.id] = d); POSTS = buildPosts();
  renderTabs(); setBar("main");
  if (DEMO) runDemo(DEMO); else route();
}).catch(() => { stage.innerHTML = `<div class="loading">Couldn't load the dogs. Pull to refresh.</div>`; });
</script>
</body>
